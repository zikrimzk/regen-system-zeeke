<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ReGen powered by Zeeke</title>
  <link rel="stylesheet" href="/css/main.css?v=20260724d">
  <link rel="stylesheet" href="/css/auth.css?v=20260724d">
</head>
<body class="auth-page">
  <div id="toast-container"></div>
  <div id="page-loader"><div class="spinner"></div><p></p></div>

  <header class="auth-header">
    <div class="auth-header-logo" aria-hidden="true">R</div>
    <div class="auth-header-title"><strong>ReGen</strong><small>powered by Zeeke</small></div>
  </header>

  <main class="auth-body">
    <div class="auth-card">
      <h1 class="auth-card-title">Log in</h1>
      <p class="auth-card-subtitle">Access your resume workspace.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div id="login-error" class="auth-error-box"></div>

        <div class="auth-form-group">
          <label class="auth-label" for="email">Email</label>
          <input type="email" id="email" class="auth-input" placeholder="name@company.com" maxlength="200" required autofocus>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">Password</label>
          <div class="auth-password-wrap">
            <input type="password" id="password" class="auth-input" placeholder="Password" required>
            <button type="button" class="auth-password-toggle" tabindex="-1" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="login-btn">Log In</button>

        <div class="auth-link-row">
          Don't have an account? <a href="/register">Register here</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/api.js?v=20260723b"></script>
  <script src="/js/auth.js?v=20260723b"></script>
</body>
</html>
