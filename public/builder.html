<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Editor | ReGen powered by Zeeke</title>
  <link rel="stylesheet" href="/css/main.css?v=20260724d">
  <link rel="stylesheet" href="/css/stepper.css?v=20260724d">
  <link rel="stylesheet" href="/css/form.css?v=20260724d">
</head>
<body class="builder-page">
  <div id="toast-container"></div>
  <div id="page-loader"><div class="spinner"></div><p>Saving...</p></div>

  <nav class="topbar">
    <a href="/dashboard" class="topbar-brand">
      <div class="topbar-logo-mark" aria-hidden="true">R</div>
      <div class="topbar-brand-name"><strong>ReGen</strong><small>powered by Zeeke</small></div>
    </a>
    <div class="topbar-spacer"></div>
    <div class="topbar-user">
      <button type="button" class="btn btn-secondary btn-sm preview-command" id="preview-open-top">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
      <a href="/dashboard" class="btn btn-ghost btn-sm btn-icon dashboard-command" aria-label="Dashboard" title="Dashboard">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg>
      </a>
      <div class="account-menu">
        <button type="button" class="account-menu-toggle" id="account-menu-toggle" aria-expanded="false" aria-haspopup="menu">
          <span class="topbar-avatar" id="topbar-avatar">U</span>
          <span class="topbar-user-name" id="topbar-user-name">User</span>
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="account-menu-panel hidden" id="account-menu-panel" role="menu">
          <button type="button" class="account-menu-item" id="account-menu-logout" role="menuitem">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>
            Log out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="builder-layout">
    <div class="builder-left">
      <div id="stepper-wrap">
        <div class="stepper-meta">
          <div class="stepper-step-label" id="progress-label">Step 1 of 10</div>
        </div>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <div class="stepper-track" id="stepper-track" role="tablist"></div>
      </div>

      <main id="step-content" role="main"></main>

      <div class="nav-bar">
        <button type="button" class="btn btn-secondary" id="btn-back" style="visibility:hidden;">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
          Back
        </button>
        <div class="builder-nav-center">
          <div id="save-indicator">
            <span class="save-dot"></span>
            Changes saved
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="btn-next">
          Next Step
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="preview-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Resume Preview">
    <div class="preview-modal-box">
      <div class="preview-modal-header">
        <div>
          <h3 class="preview-modal-title">Resume Preview</h3>
          <p class="preview-modal-subtitle">A4 document view</p>
        </div>
        <div class="preview-tools" aria-label="Preview zoom controls">
          <button type="button" class="btn btn-secondary btn-sm btn-icon" id="preview-zoom-out" aria-label="Zoom out" title="Zoom out">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button type="button" class="btn btn-secondary btn-sm btn-icon" id="preview-zoom-fit" aria-label="Fit preview" title="Fit preview">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M16 21h5v-5"/></svg>
          </button>
          <button type="button" class="btn btn-secondary btn-sm btn-icon" id="preview-zoom-in" aria-label="Zoom in" title="Zoom in">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
          <button type="button" class="btn btn-ghost btn-sm btn-icon" id="close-preview-modal" aria-label="Close preview" title="Close preview">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="preview-stage">
        <div class="preview-page-shell" id="preview-page-shell">
          <iframe id="preview-iframe-modal" title="Resume Preview"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=20260723b"></script>
  <script src="/js/lookups.js?v=20260723a"></script>
  <script src="/js/form-assist.js?v=20260723a"></script>
  <script src="/js/sections/personal.js?v=20260723a"></script>
  <script src="/js/sections/summary.js?v=20260723a"></script>
  <script src="/js/sections/education.js?v=20260723a"></script>
  <script src="/js/sections/experience.js?v=20260723a"></script>
  <script src="/js/sections/projects.js?v=20260723a"></script>
  <script src="/js/sections/extracurricular.js?v=20260723a"></script>
  <script src="/js/sections/skills.js?v=20260723a"></script>
  <script src="/js/sections/achievements.js?v=20260723a"></script>
  <script src="/js/sections/certifications.js?v=20260723a"></script>
  <script src="/js/sections/references.js?v=20260723a"></script>
  <script src="/js/preview.js?v=20260723c"></script>
  <script src="/js/stepper.js?v=20260723a"></script>
  <script src="/js/app.js?v=20260723c"></script>
</body>
</html>
