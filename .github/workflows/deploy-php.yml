name: Deploy PHP to DirectAdmin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare committed application files
        run: |
          mkdir -p .release/_app
          cp -R public/. .release/
          cp -R php/. .release/_app/
          test -f .release/index.php
          test -f .release/_app/bootstrap.php

      - name: Validate FTP destination
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [[ -z "$FTP_SERVER_DIR" ]]; then
            echo "::error::FTP_SERVER_DIR is missing."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" == /* ]]; then
            echo "::error::FTP_SERVER_DIR must be relative to the FTP login root. Do not use /home/... or any absolute server path."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" == *".."* ]]; then
            echo "::error::FTP_SERVER_DIR must not contain '..'."
            exit 1
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must end with a trailing slash."
            exit 1
          fi

      - name: Deploy release through FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./.release/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: _app/.ftp-deploy-code-state.json
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            vendor/**
            **/vendor/**
            uploads/**
            **/uploads/**
            **/.env*
            **/config.local.php
            **/config.local.example.php
