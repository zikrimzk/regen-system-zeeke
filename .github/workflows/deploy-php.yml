name: Build PHP release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy through the configured FTPS account
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: php-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo_mysql, zip
          coverage: none
      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
      - name: Validate and build upload ZIP
        run: |
          composer validate --strict
          composer audit --locked --no-dev
          composer release
      - uses: actions/upload-artifact@v4
        with:
          name: regen-php
          path: release/regen-php.zip
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: regen-php
      - name: Extract release and validate destination
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          mkdir .release
          unzip -q regen-php.zip -d .release
          if [[ -z "$FTP_SERVER_DIR" || "$FTP_SERVER_DIR" == /* || "$FTP_SERVER_DIR" == *".."* || "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must be a relative public_html path ending in '/'."
            exit 1
          fi
      - name: Deploy through FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./.release/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: _app/.ftp-deploy-code-state.json
          log-level: minimal
          exclude: |
            **/.env
            uploads/**
            storage/**
