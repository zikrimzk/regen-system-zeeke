<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{i18n.nav.tokens}} | {{BRAND_NAME}}</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/appearance.css">
  <script src="/js/store.js" defer></script>
</head>
<body class="user-workspace store-page" data-token-view="activity">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  {{WORKSPACE_HEADER}}
  <main class="token-store-main k-store-main k-store-history" id="main-content" tabindex="-1">
    <header class="store-page-heading"><h1>{{i18n.nav.tokens}}</h1><p>{{i18n.store.activityHelp}}</p></header>
    {{STORE_NAVIGATION}}
    <div id="store-status" role="status"></div>
    <div id="token-store-content" aria-busy="true"><p class="store-loading" role="status">{{i18n.nav.billingLoading}}</p></div>
  </main>
</body>
</html>
