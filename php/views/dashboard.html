<body class="user-workspace dashboard-page" data-workspace-view="{{WORKSPACE_VIEW}}">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  <div id="toast-container"></div>
  <div id="page-loader"><div class="spinner"></div><p></p></div>

  {{WORKSPACE_HEADER}}

  <main id="main-content" tabindex="-1" class="dashboard-content">
    <header class="dash-page-header">
      <div><h1 class="dash-page-title">{{WORKSPACE_H1}}</h1><p><strong id="workspace-candidate" hidden></strong>{{WORKSPACE_INTRO}}</p></div>
    </header>
    <section class="campaign-feed" data-campaign-feed aria-label="{{i18n.nav.notifications}}"></section>
    <div class="overview-layout">
      <div id="resume-home" aria-live="polite" aria-busy="true"></div>
      <aside class="overview-secondary">
        <section id="dashboard-next-task" class="overview-next-task" hidden></section>
      </aside>
    </div>
    <section class="dashboard-documents" id="dashboard-documents" hidden aria-labelledby="dashboard-documents-title">
      <nav class="overview-quick" aria-labelledby="dashboard-documents-title">
        <h2 id="dashboard-documents-title">{{i18n.dashboard.documents}}</h2>
        <a id="dashboard-resume-link" href="/resumes" hidden></a>
        <a href="/cover-letters" data-price-feature="cover_letters" data-price-base="{{i18n.nav.letters}}"><span>{{i18n.nav.letters}}</span><span id="cover-letter-count"></span></a>
        <p id="dashboard-letter-note"></p>
        <a id="dashboard-design-link" href="/templates">{{i18n.nav.templates}}</a>
      </nav>
    </section>
    <div id="dashboard-ai-token-card" aria-live="polite">
      <p class="dashboard-loading-inline">{{i18n.dashboard.aiLoading}}</p>
    </div>
  </main>

  <dialog class="dashboard-preview-modal" id="dashboard-preview-modal" aria-labelledby="dashboard-preview-title">
    <div class="dashboard-preview-dialog">
      <div class="dashboard-preview-header">
        <div>
          
          <h2 id="dashboard-preview-title">{{i18n.dashboard.preview}}</h2>
        </div>
        <button type="button" class="btn btn-secondary btn-icon" id="dashboard-preview-close" aria-label="{{i18n.common.close}}">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="dashboard-preview-stage" id="dashboard-preview-stage">
        <div class="dashboard-preview-shell" id="dashboard-preview-shell">
          <div id="dashboard-pdf-pages" class="pdf-pages"></div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="/js/pdf-pages.js?v=20261105r15"></script>
  <script src="/js/api.js?v=20261105r15"></script>
  <script src="/js/preview-protection.js?v=20261105r15"></script>
  <script src="/js/dashboard.js?v=20261105r15"></script>
  <script src="/js/ui.js?v=20261105r15" defer></script>
  <script src="/js/mobile-viewport.js?v=20261105r15" defer></script>
  <script src="/js/pwa.js?v=20261105r15" defer></script>
</body>
