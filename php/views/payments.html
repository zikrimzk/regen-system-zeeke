<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{i18n.nav.payments}} | {{BRAND_NAME}}</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/product.css">
  <link rel="stylesheet" href="/css/appearance.css">
  <link rel="stylesheet" href="/css/payments.css">
  <script src="/js/payments.js" defer></script>
</head>
<body class="user-workspace store-page">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  {{WORKSPACE_HEADER}}
  <main class="token-store-main payments-main k-store-main k-store-history" id="main-content" tabindex="-1">
    <header class="payment-page-header" id="payment-history-heading" hidden>
      <h1>{{i18n.nav.payments}}</h1>
      <button type="button" class="btn btn-secondary" id="refresh-payments">Refresh</button>
    </header>
    {{STORE_NAVIGATION}}
    <section id="payment-return" aria-live="polite" hidden></section>
    <p id="payment-status" role="status">Loading payments…</p>
    <section id="payment-history-view" aria-label="Your payments" hidden>
      <form id="payment-filters" class="payment-filters">
        <label>Search payments<input type="search" name="q" maxlength="80" placeholder="Package name or order reference"></label>
        <label>Status<select name="status"><option value="">All statuses</option></select></label>
        <label>Date range<select name="days"><option value="">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></label>
        <div class="payment-filter-actions"><button type="submit" class="btn btn-primary">Apply</button><button type="button" class="btn btn-secondary" id="reset-payment-filters">Clear</button></div>
      </form>
      <div id="payment-history" aria-busy="true"></div>
    </section>
  </main>
</body>
</html>
