<body class="auth-journey-page user-workspace auth-page auth-login-page">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  <div id="toast-container"></div>
  <div id="page-loader"><div class="spinner"></div><p></p></div>

  <header class="auth-header">
    <a class="auth-home" href="/" aria-label="{{i18n.common.home}}">{{PRODUCT_WORDMARK}}</a>
    {{LANGUAGE_LINK}}
  </header>

  <main id="main-content" tabindex="-1" class="auth-body">
    <section class="auth-story" aria-labelledby="auth-story-title">
      <div class="auth-story-copy">
        <h2 id="auth-story-title">{{i18n.auth.exampleHeading}}</h2>
        <p>{{i18n.auth.exampleCopy}}</p>
      </div>
      <a class="auth-example" href="/samples/modern.pdf" aria-label="{{i18n.public.examplePdf}}">
        <img src="/img/templates/modern-640.webp" alt="{{i18n.public.example}}" width="640" height="905" loading="lazy">
      </a>
    </section>

    <div class="auth-card">
      <h1 class="auth-card-title">{{i18n.common.signIn}}</h1>
      <p class="auth-card-subtitle">{{i18n.auth.loginHelp}}</p>

      <div class="google-auth-block" id="google-auth" data-page="login" hidden>
        <div class="google-button-shell" id="google-button-shell" aria-live="polite"></div>
        <div class="auth-choice-divider"><span>{{i18n.auth.useEmail}}</span></div>
      </div>

      <form method="post" id="login-form" class="auth-form" novalidate>
        <div id="login-error" class="auth-error-box"></div>

        <div class="auth-form-group">
          <label class="auth-label" for="email">{{i18n.auth.email}}</label>
          <input type="email" id="email" class="auth-input" placeholder="you@example.com" maxlength="200" autocomplete="email" required autofocus>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">{{i18n.auth.password}}</label>
          <div class="auth-password-wrap">
            <input type="password" id="password" class="auth-input" placeholder="{{i18n.auth.passwordPlaceholder}}" maxlength="128" autocomplete="current-password" required>
            <button type="button" class="auth-password-toggle" aria-label="{{i18n.auth.showPassword}}">{{i18n.auth.show}}</button>
          </div>
        </div>

        <label class="auth-remember"><input type="checkbox" id="remember-me"> {{i18n.auth.remember}}</label>
        <button type="submit" class="auth-submit-btn" id="login-btn">{{i18n.common.signIn}}</button>

        <p class="auth-recaptcha-note" id="login-recaptcha-status" role="status" aria-live="polite" hidden><span>{{i18n.auth.captcha}}</span></p>

        <div class="auth-link-row">
          {{i18n.auth.noAccount}} <a href="/register">{{i18n.common.register}}</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/api.js?v=20261105r15"></script>
  <script src="/js/auth.js?v=20261105r15"></script>
  <script src="/js/ui.js?v=20261105r15" defer></script>
  <script src="/js/mobile-viewport.js?v=20261105r15" defer></script>
  <script src="/js/pwa.js?v=20261105r15" defer></script>
</body>
