<body class="user-workspace auth-page auth-journey-page auth-verification-page">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  <header class="auth-header">
    <a class="auth-home" href="/" aria-label="{{i18n.common.home}}">{{PRODUCT_WORDMARK}}</a>

    {{LANGUAGE_LINK}}
  </header>

  <main id="main-content" tabindex="-1" class="auth-body">
    <section class="auth-card" id="email-verification" aria-labelledby="verification-title">
      <div class="auth-status-mark" id="verification-mark" aria-hidden="true">@</div>
      <p class="auth-card-eyebrow" id="verification-eyebrow" hidden>{{i18n.auth.verifyTitle}}</p>
      <h1 class="auth-card-title" id="verification-title" tabindex="-1">{{i18n.auth.checkEmail}}</h1>
      <p class="auth-card-subtitle auth-verification-copy" id="verification-description">
        {{i18n.auth.verifyCopy}}
      </p>
      <p class="auth-verification-email" id="verification-email" hidden></p>

      <div class="auth-verification-action" id="verification-confirm" hidden>
        <p>{{i18n.auth.confirmLink}}</p>
        <button type="button" class="auth-submit-btn" id="verify-email-btn">{{i18n.auth.verifyButton}}</button>
      </div>

      <div class="auth-inline-status" id="verification-status" role="status" aria-live="polite" hidden></div>

      <form class="auth-resend-form" id="verification-resend-form" novalidate hidden>
        <div class="auth-form-group">
          <label class="auth-label" for="verification-email-input">{{i18n.auth.email}}</label>
          <input
            type="email"
            id="verification-email-input"
            class="auth-input"
            placeholder="name@company.com"
            maxlength="200"
            autocomplete="email"
            required
          >
        </div>
        <button type="submit" class="auth-secondary-btn" id="resend-verification-btn">{{i18n.auth.resend}}</button>

        <p class="auth-recaptcha-note" id="verification-recaptcha-status" role="status" aria-live="polite" hidden><span>{{i18n.auth.captcha}}</span></p>
      </form>

      <div class="auth-verification-links">
        <a href="/login" id="verification-login-link">{{i18n.auth.backSignIn}}</a>
      </div>
    </section>
  </main>

  <script src="/js/api.js?v=20261105r15"></script>
  <script src="/js/auth.js?v=20261105r15"></script>
  <script src="/js/ui.js?v=20261105r15" defer></script>
  <script src="/js/mobile-viewport.js?v=20261105r15" defer></script>
  <script src="/js/pwa.js?v=20261105r15" defer></script>
</body>
