<!doctype html><html lang="{{LANGUAGE}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset password | ReGen</title><script src="/js/theme.js"></script><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/product.css"></head><body class="service-page" data-service-page="reset"><main class="service-reset"><a class="service-brand" href="/login"><img src="/img/brand-wordmark.png" width="116" height="37" alt="ReGen"></a>{{LANGUAGE_LINK}}<h1>{{i18n.auth.resetTitle}}</h1><p class="service-message">{{i18n.auth.resetCopy}}</p><div id="service-feedback" role="status"></div><form class="service-form" id="reset-password-form"><label>{{i18n.auth.newPassword}}<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label>{{i18n.auth.confirmPassword}}<input type="password" name="confirmPassword" autocomplete="new-password" minlength="10" maxlength="128" required></label><button class="btn btn-primary" type="submit">{{i18n.auth.updatePassword}}</button></form><div class="service-actions"><a href="/login">{{i18n.auth.backSignIn}}</a></div></main></body></html>
