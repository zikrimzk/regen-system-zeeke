<body class="admin-login-page">
  <a class="skip-link" href="#main-content">{{i18n.common.skip}}</a>
  <main id="main-content" tabindex="-1" class="admin-login-shell">
    <section class="admin-login-context"><div><a class="admin-login-brand" href="/" aria-label="{{i18n.common.home}}">{{PRODUCT_WORDMARK}}</a><h2>{{i18n.admin.brand}}</h2><p>{{i18n.admin.loginContext}}</p></div></section>
    <section class="admin-login-card">
      {{LANGUAGE_LINK}}
      <h1>{{i18n.admin.signIn}}</h1>
      <form method="post" id="admin-login-form">
        <label>{{i18n.auth.email}}<input id="admin-email" type="email" maxlength="200" autocomplete="username" required autofocus></label>
        <label>{{i18n.auth.password}}<input id="admin-password" type="password" maxlength="128" autocomplete="current-password" required></label>
        <div class="admin-form-error" id="admin-login-error" role="alert"></div>
        <button class="btn btn-primary" type="submit">{{i18n.common.signIn}}</button>
      </form>
      <a href="/login" class="admin-return">{{i18n.admin.candidateLogin}}</a>
    </section>
  </main>
  <script src="/js/admin-login.js?v=20261105r15"></script>
  <script src="/js/ui.js?v=20261105r15" defer></script>
  <script src="/js/mobile-viewport.js?v=20261105r15" defer></script>
  <script src="/js/pwa.js?v=20261105r15" defer></script>
</body>
